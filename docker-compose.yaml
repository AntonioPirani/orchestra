services:
  postgres:
    image: postgres:16-alpine
    container_name: orchestra-postgres
    environment:
      POSTGRES_DB: orchestra_db
      POSTGRES_USER: orchestra_user
      POSTGRES_PASSWORD: orchestra_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestra_user -d orchestra_db"]
      interval: 5s
      retries: 5

volumes:
  postgres_data: